name: "HA Git Sync"
version: "1.16.1"
slug: "ha-git-sync"
description: "Safe, bidirectional Git sync for /config with staged pulls, validate-before-apply, automatic backups, and human-in-the-loop conflict resolution."
url: "https://github.com/a4ng3i/ha-git-sync/tree/main/ha-git-sync"
# .github/workflows/build.yml publishes per-arch images to GHCR on every
# push to main, tagged with this file's own `version:`. The image owner
# here must match github.repository_owner (the account the repo lives
# under) -- the workflow publishes there automatically on every push, so
# this field has to be kept in sync by hand whenever the account/org
# that owns the repo changes.
# The GHCR packages (ghcr.io/a4ng3i/{arch}-ha-git-sync) are public, so
# Supervisor can pull them anonymously -- this is what makes it do that
# instead of building the Dockerfile locally on every install/update.
image: "ghcr.io/a4ng3i/{arch}-ha-git-sync"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch
panel_title: HA Git Sync
# NOTE: this only hides the sidebar entry and blocks in-app navigation for
# non-admins -- Home Assistant's ingress proxy does not enforce it at the
# HTTP layer (verified against Core/Supervisor source; see app/auth.py's
# docstring). The app enforces admin-only access itself via
# AdminOnlyMiddleware; this flag is defense in depth, not the real control.
panel_admin: true
map:
  - config:rw
  - addon_config:rw
  - backup:rw
  - ssl:r
hassio_api: true
hassio_role: default
homeassistant_api: true
auth_api: false
host_network: false
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8099]/healthz"
options:
  repo_url: ""
  sync_mode: "manual"
  poll_interval_minutes: 15
  push_debounce_seconds: 90
  auto_restart_quiet_hours: false
  log_level: "info"
  # Default: reach Core directly by its internal hostname -- this is the
  # path confirmed to work end-to-end against a real HA OS install. The
  # alternative is "http://supervisor/core/api" (via the Supervisor's own
  # reverse proxy for Core's REST API instead of hitting Core directly);
  # switch to that if the default doesn't work on your setup.
  core_api_url: "http://homeassistant:8123/api"
schema:
  repo_url: "str?"
  sync_mode: "list(manual|polling)"
  poll_interval_minutes: "int(1,1440)"
  push_debounce_seconds: "int(5,600)"
  auto_restart_quiet_hours: "bool"
  log_level: "list(debug|info|warning|error)"
  core_api_url: "url"
