name: "HA AI Assistant (Beta)"
version: "0.1.0"
slug: "ha-ai-assistant-beta"
description: "BETA/testing channel, built from the uat branch. Independent install from the production add-on: own slug, own /data."
url: "https://github.com/a4ng3i/ha-apps/tree/main/ha-ai-assistant-beta"
# .github/workflows/build.yml publishes per-arch images to GHCR on every
# push to main/uat, tagged with this file's own `version:`. uat publishes
# the -beta image and the ha-ai-assistant-beta/ manifest in a4ng3i/ha-apps.
image: "ghcr.io/a4ng3i/{arch}-ha-ai-assistant-beta"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:stethoscope
panel_title: HA AI Assistant (Beta)
# Only hides the sidebar entry for non-admins. Home Assistant's ingress
# proxy does not enforce it at the HTTP layer, so the app enforces
# admin-only access itself (AdminOnlyMiddleware in app/main.py).
panel_admin: true
# Read-only view of Home Assistant's config folder (YAML + recorder DB).
# Nothing in this add-on can write there.
map:
  - homeassistant_config:ro
hassio_api: true
# "manager" is the lowest Supervisor role that can read other add-ons'
# logs and the host/Core/Supervisor journals ("default" is limited to
# /info endpoints). The app's Supervisor client only ever issues GET
# requests and refuses anything else (app/supervisor.py), so the extra
# rights are never exercised.
hassio_role: manager
homeassistant_api: true
auth_api: false
host_network: false
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8099]/healthz"
options:
  ai_provider: "anthropic"
  anthropic_api_key: ""
  anthropic_model: "claude-sonnet-5-5"
  ai_effort: "high"
  openai_base_url: ""
  openai_api_key: ""
  openai_model: ""
  privacy_level: "strict"
  schedule: "daily"
  schedule_time: "04:30"
  history_hours: 168
  read_recorder_db: true
  recorder_db_url: ""
  notify: true
  log_level: "info"
schema:
  ai_provider: "list(anthropic|openai_compatible|none)"
  anthropic_api_key: "password?"
  anthropic_model: "list(claude-sonnet-5-5|claude-opus-5-5|claude-haiku-5-5|claude-fable-5-1)"
  ai_effort: "list(low|medium|high|xhigh|max)"
  openai_base_url: "str?"
  openai_api_key: "password?"
  openai_model: "str?"
  privacy_level: "list(strict|balanced|minimal)"
  schedule: "list(off|daily|weekly)"
  schedule_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  history_hours: "int(1,720)"
  read_recorder_db: "bool"
  recorder_db_url: "password?"
  notify: "bool"
  log_level: "list(debug|info|warning|error)"
